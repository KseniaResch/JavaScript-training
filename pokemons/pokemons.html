<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="pokemons.css">
    <title>Document</title>
</head>
<body>
    <div class="app">
        <div class ="mainPage" id="mainPage"></div>
        <button id="loadMore">Load more</button>

        <div id="innerPokemonCard" >
            <div class="pokemoncard">
                <div class="links">
                    <div id="previousPokemon" class="linksItem">previousPokemon</div>
                    <div id="nextPokemon" class="linksItem">nextPokemon</div>
                </div>

                <div class="title">
                    <div class="name">name</div>
                    <div class="id">#123</div>
                </div>
                
                <div class="coloumns">
                    <div id="coloumnLeft">
                      <img alt="Pokemon" src="./image.png">
                      <div id="stats"> 
                        stats   
                      </div>
                    </div>

                    <div id="coloumnRight">
                        <div id="description">
                             For some time after its birth, it uses the nutrients that are packed into the seed on its back in order to grow.
                        </div>

                        <div id="abilities">
                            <div class="item">
                                <div class="label">Height</div>
                                <div class="value">2'04"</div>
                            </div>

                            <div class="item">
                                <div class="label">Weight</div>
                                <div class="value">15.2 lbs</div>
                            </div>

                            <div class="item">
                                <div class="label">Category</div>
                                <div class="value">Seed</div>
                            </div>

                            <div class="item">
                                <div class="label">Abilities</div>
                                <div class="value">Overgrow</div>
                            </div>
                        </div>

                        <div id="types"> 
                            <h3>Type</h3>

                        <div class="badges">
                            <div class="bug badge">
                                Bug
                            </div>
                            
                            <div class="grass badge">
                                Grass
                            </div>
                        </div>
                             
                        </div>
                    </div>

                </div>  
                <div id="evolutions">evolutions</div>
                <button id="exploreMorePokemons">exploreMorePokemon</button>
                <div id="cards">cards</div>
                <button id="buttonCards">explore more cards</button>
            </div>
        </div>
        
        
    </div>

    <script src="pokemons.js"></script>
</body>
</html>
